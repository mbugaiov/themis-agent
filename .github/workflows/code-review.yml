name: Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

jobs:
  review:
    name: review (Themis)
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cache Cursor CLI
        id: cache-cursor
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/bin
            ~/.local/share/cursor-agent
            ~/.cursor/bin
          key: cursor-cli-${{ runner.os }}-v1
      - name: Install Cursor CLI
        run: |
          if [[ "${{ steps.cache-cursor.outputs.cache-hit }}" == "true" ]] && command -v cursor-agent >/dev/null 2>&1; then
            echo "cursor-agent ready (cache)"
            exit 0
          fi
          curl -fsSL https://cursor.com/install | bash
      - name: Add Cursor CLI to PATH
        run: |
          echo "$HOME/.cursor/bin" >> "$GITHUB_PATH"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Run Cursor code review
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          BASE: ${{ github.base_ref }}
        run: |
          if [[ -z "${CURSOR_API_KEY:-}" ]]; then
            cat > review.md <<'EOF'
          ## Summary
          Automated review cannot run — `CURSOR_API_KEY` repository secret is not configured.

          ## Blocking issues
          - Configure `CURSOR_API_KEY` under Settings → Secrets and variables → Actions before merging.

          ## Suggestions
          None.
          EOF
          else
            git fetch origin "${BASE}" --quiet || true
            PROMPT="$(bash scripts/build_review_prompt.sh \
              --pr "${{ github.event.pull_request.number }}" \
              --base "origin/${BASE}" \
              --label themis-agent \
              --local-rule .cursor/rules/code-review.mdc \
              --agents AGENTS.md \
              --themis-root .)"
            REVIEW_BIN=agent
            command -v agent >/dev/null 2>&1 || REVIEW_BIN=cursor-agent
            # Pin composer-2.5 only — no fast fallback (cost). Optimize For disabled for team.
            "$REVIEW_BIN" --force --api-key "$CURSOR_API_KEY" --model composer-2.5 --output-format text -p "$PROMPT" > review.md 2> review.err || true
            [[ -s review.md ]] || echo "Cursor review produced no output (see build log above)." > review.md
          fi
          cat review.md

      - name: Blocking review gate
        run: bash scripts/check_review_gate.sh review.md

      - name: Upload review artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: review-md
          path: review.md
          retention-days: 7

      - name: Post review comment
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let body = '';
            try {
              body = fs.readFileSync('review.md', 'utf8');
            } catch (e) {
              body = '_Review output unavailable._';
            }
            const marker = '<!-- themis-cursor-review -->';
            const full = `${marker}\n## Themis automated review\n\n${body}`;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: full,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: full,
              });
            }

  isolation:
    name: isolation (Themis)
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cache Cursor CLI
        id: cache-cursor
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/bin
            ~/.local/share/cursor-agent
            ~/.cursor/bin
          key: cursor-cli-${{ runner.os }}-v1
      - name: Install Cursor CLI
        run: |
          if [[ "${{ steps.cache-cursor.outputs.cache-hit }}" == "true" ]] && command -v cursor-agent >/dev/null 2>&1; then
            echo "cursor-agent ready (cache)"
            exit 0
          fi
          curl -fsSL https://cursor.com/install | bash
      - name: Add Cursor CLI to PATH
        run: |
          echo "$HOME/.cursor/bin" >> "$GITHUB_PATH"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: isolation (Themis)
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          BASE: ${{ github.base_ref }}
        run: |
          git fetch origin "${BASE}" --quiet || true
          bash scripts/ci_isolation.sh --mode engine --base "origin/${BASE}"

      - name: Upload isolation artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: isolation-review-md
          path: isolation-review.md
          retention-days: 7
          if-no-files-found: ignore
